[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "loupe"
version = "0.1.0"
description = "Open-source debugger for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Loupe Community" }]
keywords = ["ai", "agents", "debugging", "observability", "replay"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "fastapi>=0.111",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
arrow = ["pyarrow>=15"]
dev = [
  "httpx>=0.27",
  "mkdocs>=1.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
loupe = "loupe.cli.main:app"

[project.urls]
Homepage = "https://github.com/loupe/loupe"
Issues = "https://github.com/loupe/loupe/issues"
Documentation = "https://github.com/loupe/loupe#readme"

[tool.hatch.build.targets.wheel]
packages = ["loupe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["loupe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=loupe --cov-report=term-missing --cov-fail-under=80"
