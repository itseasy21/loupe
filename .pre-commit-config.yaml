repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [loupe]
        pass_filenames: false
        additional_dependencies:
          - fastapi>=0.111
          - pydantic>=2.7
          - typer>=0.12
  - repo: local
    hooks:
      - id: loupe-pytest
        name: loupe-pytest
        entry: python -m pytest
        language: python
        pass_filenames: false
        additional_dependencies:
          - fastapi>=0.111
          - httpx>=0.27
          - pydantic>=2.7
          - pytest>=8.2
          - pytest-cov>=5
          - typer>=0.12
