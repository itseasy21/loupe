name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.github-release.outputs.created || 'false' }}
      tag_name: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: npm ci

      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect versioned release changes
        id: release-files
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- CHANGELOG.md package.json pyproject.toml loupe/__init__.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version state
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release-files.outputs.changed == 'true'
        run: python scripts/version_sync.py check

      - name: Compute release tag
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release-files.outputs.changed == 'true'
        run: |
          echo "value=v$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('package.json').read_text())['version'])
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: github-release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release-files.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; skipping publish."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
    secrets: inherit
