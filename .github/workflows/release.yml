name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release build tools
        run: python -m pip install build twine
      - name: Verify release tag and version metadata
        run: python scripts/version_sync.py check-tag "${{ inputs.tag_name }}"
      - name: Build distribution artifacts
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
