name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release build tools
        run: python -m pip install build twine
      - name: Verify release tag and version metadata
        run: python scripts/version_sync.py check-tag "${{ inputs.tag_name }}"
      - name: Build distribution artifacts
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
